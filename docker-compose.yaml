services:
  postgres:
    image: postgres:18-alpine
    container_name: youshare
    restart: unless-stopped
    environment:
      POSTGRES_DB: youshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: